<!doctype html>
<html lang="es">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Acceso | Reporte Canvas</title>
  <link rel="shortcut icon" href="/static/img/CANVAS.ico" type="image/x-icon">
  <link rel="stylesheet" href="{{ url_for('static', filename='css/styles.css') }}">
</head>
<body>
    <header class="hero compact">
        <div>
            <p class="eyebrow">Acceso seguro</p>
            <h1>Reporte integral de capacitaciones</h1>
            <p class="subtitle">Ingresa la contraseña para consultar el reporte.</p>
        </div>
    </header>

    <main class="container narrow">
        <section class="section panel login-panel">
            <h2>Iniciar sesión</h2>
            <p class="muted">Este reporte es de consulta interna para el periodo actual.</p>
            {% if error %}
                <div class="alert">{{ error }}</div>
            {% endif %}
            <form method="post" class="form">
                <label for="password">Contraseña</label>
                <input id="password" name="password" type="password" required autofocus>
                <button class="btn" type="submit">Entrar</button>
            </form>
        </section>
    </main>
</body>
</html>
