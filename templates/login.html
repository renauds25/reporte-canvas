<!doctype html>
<html lang="es">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Acceso | Reporte Canvas</title>
    <link rel="icon" type="image/svg+xml" href="{{ url_for('static', filename='img/favicon.svg') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/styles.css') }}">
</head>
<body>
    <header class="hero compact">
        <div>
            <p class="eyebrow">Acceso seguro</p>
            <h1>Reporte integral de capacitaciones</h1>
            <p class="subtitle">Ingresa con tu cuenta institucional de Google.</p>
        </div>
    </header>

    <main class="container narrow">
        <section class="section panel login-panel">
            <h2>Iniciar sesión</h2>
            <p class="muted">Solo se permite el acceso con cuentas <strong>@{{ allowed_domain }}</strong>.</p>
            {% if error %}
                <div class="alert">{{ error }}</div>
            {% endif %}
            <a class="btn google-btn" href="{{ url_for('login_google') }}">Continuar con Google</a>
        </section>
    </main>
</body>
</html>
